# HSS Payload Configuration
set-name: 'OrbSight2-BSP'

# Define entry points for the harts (U54_1 is common for bare metal)
hart-entry-points: {u54_1: '0x80000000', u54_2: '0x80000000', u54_3: '0x80000000', u54_4: '0x80000000'}

payloads:
  # Path to your .elf file from SoftConsole
  bin/mpfs-bsp-orbsight-v2.elf: {
#   exec-addr: '0x80000000',   /// DDR
#   exec-addr: '0x08000000',   /// LIM
    exec-addr: '0x08000000',
    owner-hart: u54_1, 
    priv-mode: prv_m, 
   skip-opensbi: true
 }
